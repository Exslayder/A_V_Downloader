name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade yt-dlp pyinstaller -r requirements.txt

    - name: Download ffmpeg
      shell: powershell
      run: |
        curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
        Get-ChildItem -Path ffmpeg_extracted -Filter ffmpeg.exe -Recurse | Move-Item -Destination .

    - name: Build EXE
      run: pyinstaller --onefile --console --hidden-import=tkinter --add-binary "ffmpeg.exe;." main.py

    - name: Upload to Latest Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: powershell
      run: |
        $LATEST_TAG = (gh release list --limit 1 --json tagName,isLatest -q ".[] | select(.isLatest == true).tagName")
        
        if (-not $LATEST_TAG) {
            $LATEST_TAG = (gh release list --limit 1 --json tagName -q ".[0].tagName")
        }
        
        Write-Host "Найден последний релиз: $LATEST_TAG"
        
        gh release upload $LATEST_TAG dist/main.exe --clobber