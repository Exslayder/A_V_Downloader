name: Secret check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect updater key secret
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Content -Path test.txt -Value 'hello'
          $k = [string]$env:KEY
          $bytes = [Text.Encoding]::UTF8.GetBytes($k)
          $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '').ToLower()
          Write-Host "len=$($k.Length) lines=$(($k -split "`n").Count) sha=$sha"
          Write-Host "start=$($k.Substring(0, [Math]::Min(12, $k.Length)))"

          function Try-Sign([string]$name, [string]$value) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $value
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ''
            Remove-Item test.txt.sig -ErrorAction SilentlyContinue
            $output = npx tauri signer sign test.txt 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -and (Test-Path test.txt.sig)) {
              Write-Host "$name OK"
            } else {
              $lines = ($output -split "`n") | Where-Object { $_.Trim() -ne '' }
              Write-Host "$name FAIL: $($lines[-3..-1] -join ' ')"
            }
          }

          Try-Sign 'A_raw' $k
          try {
            $plain = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($k.Trim()))
            Try-Sign 'B_plain' $plain
          } catch {
            Write-Host "B decode error: $($_.Exception.Message)"
          }

          $path = Join-Path $env:RUNNER_TEMP 'updater.key'
          [IO.File]::WriteAllText($path, $k)
          Try-Sign 'C_path' $path
